[project]
name = "golf-pricing-engine"
version = "0.1.0"
description = "Probabilistic model and Monte Carlo simulator that prices PGA Tour outcomes and tests them against bookmaker odds."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pgatourpy",
    "requests",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.uv.sources]
# Not on PyPI as used here; pinned to the commit the data was built with.
pgatourpy = { git = "https://github.com/WalrusQuant/pgatourPY.git", rev = "1aba86d23c3ec97502f578af94736db07144afbe" }

[tool.pytest.ini_options]
# The code lives in src/<area>/ and is imported as `src.<area>`.
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
