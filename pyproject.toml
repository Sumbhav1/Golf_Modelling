[project]
name = "golf-pricing-engine"
version = "0.1.0"
description = "Probabilistic model and Monte Carlo simulator that prices PGA Tour outcomes and tests them against bookmaker odds."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "pyyaml",
    "scikit-learn",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
# The code lives in src/<area>/ and is imported as `src.<area>`.
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
