# Seasons, splits and model parameters. Every reported number must be reproducible from this file.

data:
  events_history: data/processed/player_events_2018_2025.csv
  rounds_history: data/processed/player_rounds_2018_2025.csv
  events_2026: data/processed/player_events_2026.csv
  rounds_2026: data/processed/player_rounds_2026.csv

# Seasons are the Tour season labels (see docs/DATA_STRUCTURE.md).
splits:
  # 2018 has no earlier season to build features from, so training starts in 2019.
  first_train_season: 2019
  # Walk-forward: each validation season is predicted by a model trained on all earlier seasons.
  validation_seasons: [2023, 2024]
  # Frozen. Used only for final reporting; never tune, select features or set thresholds on it.
  # Any look must be logged in docs/DECISIONS.md.
  holdout_seasons: [2025]
  # In-progress season, kept separate for prediction and forward testing.
  forward_test_seasons: [2026]

baseline1:
  feature: sg_total
  # Rolling windows in seasons; 10 is the same as "all earlier seasons" with this much history.
  windows: [3, 5, 10]
  labels: [made_cut, top10, win]

model1:
  rating:
    # Grid searched on the validation seasons only (top-10 log loss of the logistic model).
    long_half_life_days: [180, 365, 730]
    shrinkage_rounds: [10, 30, 60]
    # Recent form is the short-window rating minus the long-window rating.
    short_half_life_days: 60
  logistic_c: 1.0   # inverse ridge strength on standardised features
  win_l2: 1.0       # ridge strength for the win softmax
  top10_normalise: true   # shift probabilities within an event to add up to the top-10 places
  boosting:
    max_depth: 3
    learning_rate: 0.05
    max_iter: 300
    min_samples_leaf: 50
    l2_regularization: 1.0

sim:
  # A 0.5% event (e.g. a plausible win chance) has a Monte Carlo standard error of about 14% of
  # its own value at 10,000 sims; 30,000 brings that to about 8%. The Phase 2 "10,000+ sims in
  # seconds" target is checked separately (see the speed check in the simulator report) and is not
  # tied to this production setting.
  n_sims: 30000
  # Approximates the cutline as a fixed share of the field, for events without a known outcome
  # (the historical average make-cut rate is about 0.52). Validation always also reports the
  # "actual" cut mode, which replays the real number of survivors, to isolate the round-score
  # model's quality from this assumption.
  fallback_cut_fraction: 0.5

evaluation:
  bootstrap_samples: 1000
  seed: 42
  calibration_bins: 10
  report_dir: reports
